{% extends "base.html" %}
{% load static %}
{% block title %}
    تسجيل الدخول | قطع غيارك
{% endblock %}

{% block body %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>قطع غيارك</h1>
            <p>تسجيل الدخول إلى لوحة المتجر</p>
        </div>

        <!-- Phone Step -->
        <div id="phone-step">

            <div class="form-group">
                <label for="phone">
                    رقم الهاتف
                </label>

                <input
                    type="tel"
                    id="phone"
                    class="form-control"
                    placeholder="01xxxxxxxxx"
                    autocomplete="tel"
                >
            </div>

            <button
                type="button"
                id="request-otp-btn"
                class="auth-button"
            >
                إرسال رمز التحقق
            </button>

        </div>


        <!-- OTP Step -->
        <div id="otp-step" class="d-none">

            <div class="form-group">
                <label for="otp">
                    رمز التحقق
                </label>

                <input
                    type="text"
                    id="otp"
                    class="form-control"
                    placeholder="أدخل رمز التحقق"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                >
            </div>

            <button
                type="button"
                id="verify-otp-btn"
                class="auth-button"
            >
                تسجيل الدخول
            </button>

            <button
                type="button"
                id="back-to-phone-btn"
                class="auth-back-button"
            >
                تغيير رقم الهاتف
            </button>

        </div>


        <div
            id="auth-message"
            class="auth-message d-none"
        ></div>

    </div>

</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'dashboard/js/auth.js' %}"></script>
{% endblock %}
